[project]
name = "koc-discovery"
version = "0.1.0"
description = "AI KOC Discovery: tìm KOC TikTok phù hợp chiến dịch với chi phí AI tối ưu"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "google-genai>=1.40",
    "imageio-ffmpeg>=0.5",
    "openai>=1.50",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "yt-dlp[curl-cffi]>=2025.1.1",
]

[project.scripts]
koc = "koc.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/koc"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
