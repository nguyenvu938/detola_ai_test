<script>
// ---------- tiện ích ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const vnd = (x) => x == null ? "–" : (x / 1e6).toLocaleString("vi-VN", {maximumFractionDigits: 2}) + " tr";
const usd = (x, d = 4) => x == null ? "–" : "$" + Number(x).toFixed(d);
const pct = (x) => x == null ? "–" : Math.round(x * 100) + "%";
const num = (x) => x == null ? "–" : Number(x).toLocaleString("vi-VN");
// Bản HTML tĩnh (koc export-html): dữ liệu nhúng sẵn, không gọi server
const STATIC = window.__KOC_STATIC__ || null;
async function api(path) {
  if (STATIC) {
    const u = new URL(path, "http://local");
    if (u.pathname === "/api/runs") return STATIC.runs;
    if (u.pathname === "/api/result") {
      const r = STATIC.results[u.searchParams.get("run")];
      if (!r) throw new Error(`Bản tĩnh chỉ chứa run ${STATIC.run_id}`);
      return r;
    }
    if (u.pathname === "/api/benchmark") {
      if (!STATIC.benchmark) throw new Error("Bản tĩnh không có benchmark");
      return STATIC.benchmark;
    }
    if (u.pathname === "/api/scale") {
      if (!STATIC.scale) throw new Error("Bản tĩnh không có kết quả đo mở rộng");
      return STATIC.scale;
    }
    throw new Error("STATIC");
  }
  const r = await fetch(path, {cache: "no-store"});
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}
// "00:13.7" | "0.5s (frame 1)" | "frame 4 @ 16.5s" -> giây
function seconds(at) {
  const s = String(at);
  let m = s.match(/(\d+):(\d+(?:\.\d+)?)/);
  if (m) return Number(m[1]) * 60 + Number(m[2]);
  m = s.match(/(\d+(?:\.\d+)?)\s*s/);
  return m ? Number(m[1]) : null;
}
const BASIS = {
  creators_list: "danh mục, mọi kênh bán", creators_list_video: "danh mục, bán qua video",
  creators_list_content: "vài video organic", creators_list_research: "mọi ngành hàng",
};

// ---------- trạng thái ----------
let RUN = STATIC ? STATIC.run_id : (new URLSearchParams(location.search).get("run") || "final");
let TAB = "result";
let pollTimer = null;

document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => showTab(b.dataset.tab));
$("#run").onchange = (e) => { RUN = e.target.value; if (!STATIC) history.replaceState(null, "", "?run=" + RUN); loadAll(); };

// Dải thông báo: nói rõ người xem đang thấy DỮ LIỆU ĐÃ LƯU, không phải hệ thống đang gọi model
function renderBanner(d, b) {
  const parts = [];
  if (d) parts.push(`run <b>${esc(d.run_id)}</b> chạy lúc ${esc(d.generated_at || "?")} ` +
    `(${num(d.llm_calls)} lần gọi model, ${usd(d.cost_usd)}; ${esc(Object.entries(d.routing || {}).map(([k, v]) => k + "=" + v).join(", "))})`);
  if (b) parts.push(`benchmark chạy lúc ${esc(b.generated_at || "?")} (${usd(b.total_cost_usd, 2)})`);
  const how = STATIC
    ? `Đây là <b>bản HTML tĩnh</b> xuất lúc ${esc(STATIC.exported_at)}: mở trực tiếp, không cần Python hay API key; video mở bằng link TikTok.`
    : `Trang chỉ đọc các file kết quả và SQLite, không gọi model, không tốn tiền.`;
  $("#banner").innerHTML = `<b>Dữ liệu đã lưu (cache)</b> – ${parts.join(" · ")}. ${how}
    Chạy lại với AI thật: <code>uv run koc run --run-id ${esc(RUN)}</code> (cần API key, xem README).`;
}

function showTab(t) {
  TAB = t;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  ["result", "progress", "cost", "bench", "scale"].forEach(x => $("#tab-" + x).hidden = x !== t);
  if (t === "progress") startPolling(); else stopPolling();
}

async function loadRuns() {
  const runs = await api("/api/runs").catch(() => []);
  const ids = new Set(runs.map(r => r.run_id)); ids.add("final"); ids.add(RUN);
  $("#run").innerHTML = [...ids].map(id => {
    const r = runs.find(x => x.run_id === id);
    const tag = r ? (r.status === "running" ? " · đang chạy" : "") : "";
    return `<option value="${esc(id)}" ${id === RUN ? "selected" : ""}>${esc(id)}${tag}</option>`;
  }).join("");
}

// ---------- tab Đề xuất ----------
function renderResult(d) {
  const c = d.campaign || {};
  $("#brief").innerHTML = [
    c.product && `Sản phẩm: ${c.product}`, c.target_gender && `Khán giả: ${{female: "nữ", male: "nam", all: "mọi giới"}[c.target_gender] || c.target_gender} ${c.target_age_min}–${c.target_age_max}`,
    c.budget_vnd && `Ngân sách: ${vnd(c.budget_vnd)}`, c.n_koc && `Cần ${c.n_koc} KOC`,
  ].filter(Boolean).map(t => `<span class="chip">${esc(t)}</span>`).join("");

  const f = d.funnel;
  const steps = [
    ["Creator từ Kalodata", f.ingested], ["Qua lọc luật", f.after_prefilter], ["Lấy chi tiết", f.enriched_target],
    ["Đúng khán giả/loại TK", f.after_metrics], ["LLM sàng lọc", f.screened], ["Qua cổng sàng lọc", f.passed_screen_gate],
    ["AI xem video", f.video_analyzed], ["Đạt ngưỡng điểm", f.above_min_score], ["Chọn", f.selected],
  ];
  const ch = d.choice;
  let html = `<h2>Phễu xử lý</h2><div class="funnel">${steps.map(([l, n], i) =>
    `<div class="step ${i === steps.length - 1 ? "final" : ""}"><b>${num(n)}</b><span>${esc(l)}</span></div>`).join("")}</div>`;
  if (d.summary) html += `<h2>Tóm tắt</h2><div class="panel">${esc(d.summary)}</div>`;
  html += `<h2>${d.kocs.length} KOC đề xuất</h2>
    <p class="muted">Booking ước tính <b>${vnd(ch.total_cost_vnd)}</b> · còn <b>${vnd(ch.ads_reserve_vnd)}</b> chạy Spark Ads
    (khuyến nghị ${vnd(ch.recommended_ads_vnd)}) · chi phí AI cả run <b>${usd(d.cost_usd)}</b>
    ${d.citation_check ? ` · trích dẫn hợp lệ ${pct(d.citation_check.valid_rate)} (${d.citation_check.refs_total} mã)` : ""}</p>`;
  if (ch.note) html += `<div class="note">${esc(ch.note)}</div>`;
  if (ch.ads_note) html += `<div class="note">${esc(ch.ads_note)}</div>`;
  html += `<div class="grid">${d.kocs.map((k, i) => kocCard(k, i + 1, c)).join("")}</div>`;

  if ((ch.below_threshold || []).length) {
    html += `<h2>Đã xem video nhưng dưới ngưỡng điểm</h2><div class="panel">${ch.below_threshold.map(b =>
      `<span class="chip">@${esc(b.handle)} · ${b.final_score.toFixed(2)}</span>`).join(" ")}</div>`;
  }
  html += `<details><summary>Kết quả LLM sàng lọc (${d.screens.length} creator)</summary><div class="scroll"><table>
    <tr><th>Creator</th><th>Loại tài khoản</th><th>Ngách</th><th class="n">Phù hợp</th><th>Nhận xét</th></tr>
    ${d.screens.map(s => `<tr><td>@${esc(s.handle)}</td><td>${esc(s.account_kind)}</td><td>${esc(s.primary_niche)}</td>
      <td class="n">${s.topic_relevance}/10</td><td>${esc(s.fit_note)}</td></tr>`).join("")}</table></div></details>
    <details><summary>Bị loại ở bước định lượng (${d.dropped.length})</summary><ul>${d.dropped.map(x =>
      `<li>@${esc(x.handle)}: ${esc(x.reason)}</li>`).join("")}</ul></details>`;
  $("#tab-result").innerHTML = html;
  // bấm mốc thời gian -> tua video
  document.querySelectorAll(".ts[data-t]").forEach(b => b.onclick = () => {
    const v = document.getElementById(b.dataset.v);
    if (v) { v.currentTime = Number(b.dataset.t); v.play(); }
  });
}

function kocCard(k, rank, camp) {
  const r = k.row, v = k.video || {}, a = v.analysis || {}, rat = k.rationale || {};
  const vidId = "v-" + (v.video_id || rank);
  const local = k.has_local_video && v.kind === "video";
  const media = local
    ? `<video id="${vidId}" controls preload="metadata" src="/video/${esc(v.video_id)}.mp4"></video>`
    : `<div class="panel muted" style="font-size:13px">${v.kind === "video"
        ? "Video chưa tải về máy này (thư mục data/videos không nằm trong repo)."
        : "Bài này chỉ phân tích được ảnh bìa (TikTok không cung cấp luồng video)."}<br>
        <a href="${esc(v.url)}" target="_blank" rel="noopener">Mở bài trên TikTok ↗</a></div>`;
  const parts = r.metric_parts || {};
  const bars = [["Định lượng", r.metric_score], ["Sàng lọc", r.screen_score], ["Video", r.video_score], ["Tổng", r.final_score]]
    .map(([l, x]) => `<span>${l}</span><div class="bar"><i style="width:${Math.round((x || 0) * 100)}%"></i></div><span class="n">${(x ?? 0).toFixed(2)}</span>`).join("");
  const ev = (a.evidence || []).map(e => {
    const t = seconds(e.at);
    const btn = local && t != null
      ? `<button class="ts" data-v="${vidId}" data-t="${t}" title="Tua tới mốc này">${esc(e.at)}</button>`
      : `<button class="ts" disabled>${esc(e.at)}</button>`;
    return `<li>${btn}${esc(e.observation)}</li>`;
  }).join("");
  const flags = [
    a.face_on_camera ? "lộ mặt" : "không lộ mặt", a.product_demo_on_skin ? "thử trên da" : "không thử trên da",
    a.is_on_topic ? `đúng chủ đề ${camp.product || ""}` : "lệch chủ đề", `hook ${a.hook_strength}/5`,
  ].map(t => `<span class="chip">${esc(t)}</span>`).join(" ");
  return `<article class="panel koc">
    <div>
      <div class="koc-head"><span class="rank">#${rank}</span>
        <h3><a href="https://www.tiktok.com/@${esc(r.handle)}" target="_blank" rel="noopener">@${esc(r.handle)}</a></h3>
        <span class="muted">${esc(r.nickname || "")}</span></div>
      <div class="kv"><span>Follower <b>${num(r.followers)}</b></span><span>Chi phí ước tính <b>${vnd(r.est_cost_vnd)}</b></span>
        <span>Doanh thu 30 ngày <b>${vnd(r.category_gmv_vnd)}</b> (${esc(BASIS[r.gmv_basis] || "?")})</span>
        <span>Khán giả: <b>${esc(r.audience_source || "–")}</b></span>
        ${r.engagement_rate ? `<span>ER <b>${(r.engagement_rate * 100).toFixed(2)}%</b></span>` : ""}</div>
      <p>${esc(rat.reason_vi || "")}</p>
      ${rat.risks_vi ? `<div class="risk"><b>Rủi ro:</b> ${esc(rat.risks_vi)}</div>` : ""}
      ${r.reach_flag ? `<div class="risk"><b>Cờ:</b> ${esc(r.reach_flag)}</div>` : ""}
      ${rat.brief_suggestion_vi ? `<div class="brief"><b>Gợi ý brief:</b> ${esc(rat.brief_suggestion_vi)}</div>` : ""}
      <div class="bars">${bars}</div>
      <details><summary>Điểm định lượng chi tiết & mã bằng chứng</summary>
        <div class="kv">${Object.entries(parts).map(([x, y]) => `<span>${esc(x)} <b>${y}</b></span>`).join("")}</div>
        <ul class="ev">${Object.entries(k.evidence || {}).map(([code, txt]) => `<li><span class="codes">${esc(code)}</span> ${esc(txt)}</li>`).join("")}</ul>
        <p class="codes">LLM trích: ${esc((rat.evidence_refs || []).join(", "))}</p>
      </details>
    </div>
    <div>
      ${media}
      <div style="margin-top:8px">${flags}</div>
      <p style="font-size:13px;margin:8px 0 0">${esc(a.summary_vi || "")}</p>
      <ul class="ev">${ev}</ul>
      <p class="muted" style="font-size:12px;margin-top:6px">Cách AI xem: ${esc((v.input || {}).mode || "")}
        ${v.format_mix ? ` · ${v.format_mix.no_stream_posts}/${v.format_mix.checked} bài kiểm không có luồng video` : ""}</p>
    </div>
  </article>`;
}

// ---------- tab Tiến độ (hỏi lại mỗi 2 giây) ----------
const STAGES = [["enrich", "S2 Lấy chi tiết"], ["screen", "S4 LLM sàng lọc"], ["video", "S5 AI xem video"], ["rationale", "S7 Viết lý do"]];
async function renderProgress() {
  let p;
  if (STATIC) {
    $("#tab-progress").innerHTML = `<div class="empty">Bản HTML tĩnh không có tiến độ trực tiếp.<br>
      Muốn xem checkpoint chạy thật: <code>uv run koc serve</code> ở một cửa sổ và <code>uv run koc run --run-id demo</code> ở cửa sổ khác (cần API key).</div>`;
    return;
  }
  try { p = await api("/api/progress?run=" + encodeURIComponent(RUN)); }
  catch (e) { $("#tab-progress").innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  if (!p.run) {
    $("#tab-progress").innerHTML = `<div class="empty">Máy này chưa có trạng thái của run <b>${esc(RUN)}</b> (state/koc.db không nằm trong repo).<br>
      Chạy <code>uv run koc run --run-id ${esc(RUN)}</code> ở terminal rồi mở lại tab này để xem tiến độ trực tiếp.</div>`;
    return;
  }
  const running = p.run.status === "running";
  const elapsed = ((p.run.finished_at || p.now) - p.run.started_at);
  let html = `<h2>Run ${esc(RUN)} <span class="pill ${running ? "warn" : "ok"}">${running ? "đang chạy" : "xong"}</span></h2>
    <div class="cards3">
      <div class="panel"><div class="muted">Chi phí AI tới giờ</div><div class="big">${usd(p.cost_usd)}</div></div>
      <div class="panel"><div class="muted">Lời gọi model</div><div class="big">${num(p.usage.reduce((s, u) => s + u.calls, 0))}</div>
        <div class="muted">cache hit ${num(p.usage.reduce((s, u) => s + (u.cache_hits || 0), 0))}</div></div>
      <div class="panel"><div class="muted">Từ lúc bắt đầu run</div><div class="big">${Math.round(elapsed)}s</div></div>
    </div><h2>Checkpoint từng stage</h2><div class="panel">`;
  for (const [key, label] of STAGES) {
    const s = p.stages[key] || {};
    const done = (s.done || 0) + (s.skipped || 0), failed = s.failed || 0, total = done + failed;
    const w = total ? Math.round(done / total * 100) : 0;
    html += `<div class="stage-row"><span>${label}</span><div class="bar"><i style="width:${w}%"></i></div>
      <span class="muted">${done} xong${failed ? ` · <span style="color:var(--bad)">${failed} lỗi</span>` : ""}</span></div>`;
  }
  html += `</div><p class="muted" style="font-size:13px">Mỗi item xong được ghi ngay vào SQLite. Dừng giữa chừng (Ctrl+C hoặc <code>--crash-after N</code>)
    rồi chạy lại cùng lệnh: các thanh trên không quay về 0 và không có lời gọi model lặp lại.</p>
    <h2>Lời gọi model gần nhất</h2><div class="scroll"><table>
    <tr><th>Stage</th><th>Model</th><th>Kết quả</th><th class="n">Token vào</th><th class="n">Token ra</th><th class="n">USD</th><th class="n">Độ trễ</th></tr>
    ${p.recent_calls.map(c => `<tr><td>${esc(c.stage)}</td><td>${esc(c.model)}</td>
      <td>${c.cache_hit ? '<span class="pill ok">cache</span>' : c.ok ? '<span class="pill ok">ok</span>' : '<span class="pill bad">lỗi</span>'}</td>
      <td class="n">${num(c.input_tokens)}</td><td class="n">${num(c.output_tokens)}</td><td class="n">${usd(c.cost_usd, 5)}</td>
      <td class="n">${c.latency_ms ? (c.latency_ms / 1000).toFixed(1) + "s" : "–"}</td></tr>`).join("")}</table></div>`;
  $("#tab-progress").innerHTML = html;
}
function startPolling() { stopPolling(); renderProgress(); pollTimer = setInterval(renderProgress, 2000); }
function stopPolling() { if (pollTimer) clearInterval(pollTimer); pollTimer = null; }

          ${v.best_quality ? `<span>Khớp cao nhất: <b>${esc(v.best_quality.model)}</b> ${pct(v.best_quality.agreement)} · ${usd(v.best_quality.usd_500_koc, 2)}/500 KOC</span>` : ""}</div>

      <h2>Chi phí AI dự phóng cho 500 KOC</h2><div class="scroll"><table>
      <tr><th>Phương án</th><th>Sàng lọc</th><th>Xem video</th><th>Viết lý do</th><th class="n">USD / 500 KOC</th></tr>

      </table></div>`;
    if (rec.providers?.length) {
      const P = rec.providers, ST = {screen: "Sàng lọc", video: "Xem video", rationale: "Viết lý do"};
      const FV = {account_kind: "Loại tài khoản", primary_niche: "Ngách", is_on_topic: "Đúng chủ đề", face_on_camera: "Lộ mặt",
                  product_demo_on_skin: "Thử sản phẩm trên da", shows_texture_or_finish: "Kết cấu / độ hoàn thiện", presenter_gender: "Giới tính người dẫn"};
      const planCost = (name) => (rec.plans.find(p => p.name === "Chỉ dùng " + name) || {}).usd_500_koc;
      const cell = (st, c) => {

        const k = c.pick, chosen = c.why === "được chọn";
        const agree = st === "rationale" ? `trích dẫn ${pct(k.agreement)}` : `khớp ${pct(k.agreement)}${c.passes ? "" : " (chưa đạt)"}`;
        let more = k.input ? `<br><span class="muted">${esc(k.input)}</span>` : "";
        if (st !== "rationale" && c.best.model !== k.model) more += `<br><span class="muted">khớp cao nhất: ${esc(c.best.model)} ${pct(c.best.agreement)}, ${usd(c.best.usd_500_koc, 2)}</span>`;
        if (st !== "rationale" && c.cheapest && ![k.model, c.best.model].includes(c.cheapest.model))
          more += `<br><span class="muted">rẻ nhất: ${esc(c.cheapest.model)} ${pct(c.cheapest.agreement)}, ${usd(c.cheapest.usd_500_koc, 2)}</span>`;

  }
  $("#tab-bench").innerHTML = html;
}

    ${row("SQLite (checkpoint + cache)", r => `${r.db_mb} MB`)}
    </table></div>
    ${rs ? `<div class="panel" style="margin-top:12px"><b>Phục hồi ở quy mô ${rs.n_koc} KOC:</b> cho "sập" sau ${rs.crash_after} lần gọi model rồi chạy lại cùng run:
      ${rs.llm_calls_total} lần gọi trả tiền (chạy liền: ${rs.clean_calls}), <b>${rs.duplicate_paid_items} item bị gọi lặp</b>, chọn ${rs.selected} KOC
      (${rs.same_selection ? "trùng" : "khác"} bộ chọn của lần chạy liền).</div>` : ""}
    <h2>Vì sao mở rộng được</h2><ul class="ev">
      <li>Mọi tầng phễu <b>tỷ lệ với số KOC</b> (<code>*_per_koc</code> trong config): chi phí AI tăng tuyến tính theo số KOC (~$0.005/KOC), không theo số creator đầu vào.</li>
      <li>Sàng lọc, xem video, viết lý do chạy <b>song song</b> (<code>concurrency</code>); viết lý do chia lô 10 KOC/lần gọi.</li>
      <li>Bài chọn trong ngân sách: n ≤ 6 vét cạn; n lớn dùng nhân tử Lagrange + đổi chỗ (trùng đáp án vét cạn 99,4% bài thử, tệ nhất 97,5%).</li>
      <li>SQLite chế độ WAL: mỗi checkpoint 0,2 ms thay vì 103 ms; checkpoint từng item nên sập ở đâu chạy tiếp ở đó.</li>
      <li>Nút thắt còn lại ở 500 KOC: lấy chi tiết Kalodata (10 req/10 giây) và hạn mức RPM của model; xem README mục Khả năng mở rộng.</li></ul>`;
}

// ---------- tải dữ liệu ----------
async function loadAll() {
  await loadRuns();
  let d = null;
  try {
    d = await api("/api/result?run=" + encodeURIComponent(RUN));
    renderResult(d); renderCost(d);
  } catch (e) {
    $("#tab-result").innerHTML = `<div class="empty">${esc(e.message)}<br>Chạy <code>uv run koc run --run-id ${esc(RUN)}</code> trước.</div>`;
    $("#tab-cost").innerHTML = "";
  }
  const b = await api("/api/benchmark").catch(() => null);
  renderBench(b);
  renderScale(await api("/api/scale").catch(() => null));
  renderBanner(d, b);
  if (TAB === "progress") startPolling();
}
loadAll();
</script>
</body>
</html>
